<ion-header [translucent]="true">
  <ion-toolbar color="secondary">
    <ion-title>Cadastro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Novo Cadastro</ion-card-title>
      <ion-card-subtitle>Informe os dados abaixo!</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-label>Usuário:</ion-label>
        <ion-input
          [(ngModel)]="usuario.nome" placeholder="Digite o nome do usuário">
        </ion-input>
      </ion-item>

      
      <ion-item>
        <ion-label>Senha:</ion-label>
        <ion-input
          [(ngModel)]="usuario.senha" type="password" placeholder="Digite a senha">
        </ion-input>
      </ion-item>

      <ion-button expand="block" (click)="cadastrarUsuario()">
        Cadastrar Usuário
      </ion-button>

      <ion-button expand="block" color="medium" (click)="limparFormulario()">
        Limpar Campos
      </ion-button>

    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Operações</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <!-- Botão Receber -->
      <ion-button expand="block" color="success" routerLink="/receber">
        Receber
      </ion-button>

      <ion-button expand="block" color="danger" routerLink="/pagar">
        Pagar
      </ion-button>

    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      Usuários Cadastrados
    </ion-card-header>

    <ion-list *ngIf="usuariosCadastrados.length > 0; else listaVazia">

      <ion-item *ngFor="let item of usuariosCadastrados; let i = index">
        <ion-label>
          <h2>{{ i + 1 }}. {{ item.nome }}</h2>
          <p>Senha: {{ item.senha }}</p>
        </ion-label>

        <ion-button
          fill="clear" color="danger" (click)="excluirUsuario(i)">
          Excluir
        </ion-button>
      </ion-item>

    </ion-list>

    <ng-template #listaVazia>
      <ion-card-content>
        Nenhum usuário cadastrado!
      </ion-card-content>
    </ng-template>

  </ion-card>

</ion-content>
